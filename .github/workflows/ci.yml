name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new advisory against a dependency surfaces without a push.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings: an unused import in a security tool is a
  # question worth answering before it ships.
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test and lint
    # The collectors call Windows APIs, so the tests only mean anything here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck the frontend
        run: npx tsc --noEmit

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all-targets

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit --deny warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        # Rust is analysed by clippy and cargo-audit above; CodeQL covers the
        # frontend, which is where untrusted data is rendered.
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
